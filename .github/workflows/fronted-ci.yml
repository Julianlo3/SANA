
name: Frontend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "FrontEnd/sana/**"
      - ".github/workflows/frontend-ci.yml"

  push:
    branches:
      - main
    paths:
      - "FrontEnd/sana/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    name: Validate Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FrontEnd/sana

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: FrontEnd/sana/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Create reports directory
        run: mkdir -p reports

      # Análisis estático
      - name: Run ESLint
        run: npm run lint

      # Verificación de tipos TypeScript
      - name: Check TypeScript
        run: npx tsc --noEmit

      # Auditoría de dependencias de producción
      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev --json > reports/npm-audit.json

      # Pruebas unitarias, JUnit y cobertura
      - name: Run tests with coverage
        run: >
          npx vitest run
          --coverage
          --reporter=default
          --reporter=junit
          --outputFile=reports/vitest-junit.xml

      # Verifica que Next.js pueda compilarse
      - name: Build Next.js
        run: npm run build

      # Publicación de reportes
      - name: Upload frontend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: |
            FrontEnd/sana/coverage/
            FrontEnd/sana/reports/
          if-no-files-found: warn
          retention-days: 30
