name: Frontend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "FrontEnd/sana/**"
      - ".github/workflows/frontend-ci.yml"

  push:
    branches:
      - main
    paths:
      - "FrontEnd/sana/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    name: Validate Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FrontEnd/sana

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: FrontEnd/sana/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Análisis estático
      - name: Run ESLint
        run: npm run lint

      # Verificación de TypeScript
      - name: Check TypeScript
        run: npx tsc --noEmit

      # Auditoría de dependencias (solo producción: lo que corre en el
      # sitio en vivo). braces@3.0.3 (GHSA-vfj7-8cjw-p6xm), vulnerabilidad
      # de alta severidad sin fix disponible todavía, vive únicamente en
      # la cadena de devDependencies de eslint-config-next (el linter) y
      # nunca llega a producción ni procesa entrada externa.
      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev

      # Verifica que Next.js pueda compilarse
      - name: Build Next.js
        run: npm run build