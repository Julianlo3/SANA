
name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "BackEnd/backendsana/**"
      - ".github/workflows/backend-ci.yml"

  push:
    branches:
      - main
    paths:
      - "BackEnd/backendsana/**"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Validate Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: BackEnd/backendsana

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BackEnd/backendsana/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Create reports directory
        run: mkdir -p reports

      # Análisis estático
      - name: Run Oxlint
        run: npm run lint

      # Verificación de tipos
      - name: Check TypeScript
        run: npx tsc --noEmit

      # Pruebas y cobertura
      - name: Run tests with coverage
        run: >
          npm run test:cov --
          --coverage.reporter=text
          --coverage.reporter=lcov
          --coverage.reporter=html
          --coverage.reporter=cobertura
          --coverage.reporter=json-summary

      # Subir cobertura a Codecov
      - name: Upload Backend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: BackEnd/backendsana/coverage/lcov.info
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

      # Auditoría de dependencias
      - name: Audit dependencies
        run: npm audit --audit-level=high --json > reports/npm-audit.json

      # Compilación
      - name: Build NestJS
        run: npm run build

      # Resumen visual de cobertura
      - name: Generate coverage summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');

          const file = 'coverage/coverage-summary.json';
          const summary = process.env.GITHUB_STEP_SUMMARY;

          let markdown = '## Backend - Cobertura de pruebas\n\n';

          if (!fs.existsSync(file)) {
            markdown += 'No se generó el reporte de cobertura.\n';
          } else {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const total = report.total;

            markdown += '| Métrica | Cubierto | Total | Cobertura |\n';
            markdown += '|---|---:|---:|---:|\n';

            for (const key of ['lines', 'statements', 'functions', 'branches']) {
              const metric = total[key];
              if (!metric) continue;

              markdown += `| ${key} | ${metric.covered} | ${metric.total} | ${metric.pct}% |\n`;
            }
          }

          fs.appendFileSync(summary, markdown);
          NODE

      # Resumen visual de vulnerabilidades
      - name: Generate dependency security summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');

          const file = 'reports/npm-audit.json';
          const summary = process.env.GITHUB_STEP_SUMMARY;

          let markdown = '## Backend - Auditoría de dependencias\n\n';

          if (!fs.existsSync(file)) {
            markdown += 'No se encontró el reporte de auditoría.\n';
          } else {
            try {
              const report = JSON.parse(fs.readFileSync(file, 'utf8'));
              const v = report.metadata?.vulnerabilities || {};

              markdown += '| Severidad | Vulnerabilidades |\n';
              markdown += '|---|---:|\n';

              for (const level of ['critical', 'high', 'moderate', 'low', 'info']) {
                markdown += `| ${level} | ${v[level] || 0} |\n`;
              }

              markdown += `\n**Total:** ${v.total || 0}\n`;
            } catch {
              markdown += 'No fue posible interpretar el reporte JSON.\n';
            }
          }

          fs.appendFileSync(summary, markdown);
          NODE

      # Publicar reportes
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            BackEnd/backendsana/coverage/
            BackEnd/backendsana/reports/
          if-no-files-found: warn
          retention-days: 30
