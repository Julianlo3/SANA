name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "BackEnd/backendsana/**"
      - ".github/workflows/backend-ci.yml"

  push:
    branches:
      - main
    paths:
      - "BackEnd/backendsana/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    name: Validate Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: BackEnd/backendsana

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BackEnd/backendsana/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build NestJS
        run: npm run build