
name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "BackEnd/backendsana/**"
      - ".github/workflows/backend-ci.yml"

  push:
    branches:
      - main
    paths:
      - "BackEnd/backendsana/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Validate Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: BackEnd/backendsana

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BackEnd/backendsana/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Create reports directory
        run: mkdir -p reports

      # Análisis estático de código
      - name: Run Oxlint
        run: npm run lint

      # Verificación de tipos TypeScript
      - name: Check TypeScript
        run: npx tsc --noEmit

      # Pruebas automatizadas y cobertura
      - name: Run tests with coverage
        run: npm run test:cov

      # Auditoría de dependencias
      - name: Audit dependencies
        run: npm audit --audit-level=high --json > reports/npm-audit.json

      # Verifica que NestJS pueda compilarse
      - name: Build NestJS
        run: npm run build

      # Publicación de reportes
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            BackEnd/backendsana/coverage/
            BackEnd/backendsana/reports/
          if-no-files-found: warn
          retention-days: 30
