name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'BackEnd/backendsana/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'BackEnd/backendsana/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: BackEnd/backendsana
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BackEnd/backendsana/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Test with HTML coverage
        run: npm run test:cov -- --coverage.reporter=html --coverage.reporter=lcov --coverage.reporter=json-summary
      - name: Build
        run: npm run build
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-html
          path: BackEnd/backendsana/coverage/
          if-no-files-found: warn
          retention-days: 30
