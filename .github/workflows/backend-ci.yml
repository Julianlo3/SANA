name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "BackEnd/backendsana/**"
      - ".github/workflows/backend-ci.yml"

  push:
    branches:
      - main
    paths:
      - "BackEnd/backendsana/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Validate Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: BackEnd/backendsana

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BackEnd/backendsana/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Análisis estático de código
      - name: Run ESLint
        run: npm run lint

      # Verificación de tipos TypeScript
      - name: Check TypeScript
        run: npx tsc --noEmit

      # Pruebas automatizadas
      - name: Run tests
        run: npm test

      # Auditoría de dependencias
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Verifica que la aplicación pueda compilarse correctamente
      - name: Build NestJS
        run: npm run build
