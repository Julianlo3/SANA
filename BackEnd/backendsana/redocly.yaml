extends:
  - recommended

# Route summaries will progressively be added with @ApiOperation in controllers.
# The generated contract remains valid and publishable while that migration happens.
rules:
  info-license: off
  no-ambiguous-paths: off
  no-server-example.com: off
  no-unused-components: off
  operation-4xx-response: off
  operation-summary: off
  security-defined: off
